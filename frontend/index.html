<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGPF - Mars Landing Site Optimizer</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@300;600;900&display=swap"
        rel="stylesheet">

    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app-container">
        <button id="toggle-sidebar">MISSION PARAMETERS</button>

        <aside id="sidebar">
            <div class="sidebar-header">
                <div>
                    <h1>MGPF</h1>
                    <p class="subtitle">Mars Site Optimizer</p>
                </div>
                <button id="close-sidebar">&times;</button>
            </div>

            <div class="sidebar-content">
                <!-- Sliders -->
                <div class="control-group">
                    <div class="label-row">
                        <label>Water (WEH%)</label>
                        <span class="weight-val" id="val-water">1.0</span>
                    </div>
                    <input type="range" id="weight-water" min="0" max="1" step="0.05" value="1.0">
                </div>

                <div class="control-group">
                    <div class="label-row">
                        <label>Dust Content</label>
                        <span class="weight-val" id="val-dust">0.0</span>
                    </div>
                    <input type="range" id="weight-dust" min="0" max="1" step="0.05" value="0.0">
                </div>

                <div class="control-group">
                    <div class="label-row">
                        <label>Surface Temp</label>
                        <span class="weight-val" id="val-temp">0.0</span>
                    </div>
                    <input type="range" id="weight-temp" min="0" max="1" step="0.05" value="0.0">
                </div>

                <div class="control-group">
                    <div class="label-row">
                        <label>Temp Variation</label>
                        <span class="weight-val" id="val-temp-var">0.0</span>
                    </div>
                    <input type="range" id="weight-temp-var" min="0" max="1" step="0.05" value="0.0">
                </div>

                <div class="control-group">
                    <div class="label-row">
                        <label>Gravity Anomaly</label>
                        <span class="weight-val" id="val-gravity">0.0</span>
                    </div>
                    <input type="range" id="weight-gravity" min="0" max="1" step="0.05" value="0.0">
                </div>

                <div class="control-group">
                    <div class="label-row">
                        <label>TI Variance</label>
                        <span class="weight-val" id="val-ti-var">0.0</span>
                    </div>
                    <input type="range" id="weight-ti-var" min="0" max="1" step="0.05" value="0.0">
                </div>

                <div class="control-group">
                    <div class="label-row">
                        <label>Uncertainty Penalty</label>
                        <span class="weight-val" id="val-uncertainty">0.5</span>
                    </div>
                    <input type="range" id="weight-uncertainty" min="0" max="1" step="0.05" value="0.5">
                </div>

                <div class="control-group"
                    style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--glass-border);">
                    <div class="label-row">
                        <label>Heatmap Opacity</label>
                        <span class="weight-val" id="val-opacity">0.65</span>
                    </div>
                    <input type="range" id="slider-opacity" min="0" max="1" step="0.01" value="0.65">
                </div>

                <button id="recalculate-btn" style="margin-top: 5px;">Recalculate Heatmap</button>
            </div>

            <div class="sidebar-footer">
                <div class="legend">
                    <div class="legend-row"
                        style="font-size: 10px; opacity: 0.8; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">
                        Landing Suitability</div>
                    <div class="grad"></div>
                    <div class="legend-text">
                        <span>Low (Poor)</span>
                        <span>High (Optimal)</span>
                    </div>
                </div>
            </div>
        </aside>

        <div id="map"></div>

        <!-- Coordinates Box -->
        <div id="coord-display">
            <span class="coord-label">LAT</span>
            <span id="lat-display">0.00</span>
            <span class="coord-label">LON</span>
            <span id="lon-display">0.00</span>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-content">
                <div class="spinner"></div>
                <p>Recalculating Heatmap...</p>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Custom Application Logic -->
    <script src="app.js"></script>
</body>

</html>
