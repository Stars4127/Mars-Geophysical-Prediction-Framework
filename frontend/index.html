<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mars Tile Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #1a1a1a;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #000;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Initialize the map centered on typical Mars coordinates (0,0)
        // Set min/max zoom to match what the keys support effectively
        const southWest = L.latLng(-90, -180),
            northEast = L.latLng(90, 180),
            bounds = L.latLngBounds(southWest, northEast);

        const map = L.map('map', {
            crs: L.CRS.EPSG4326,
            center: [0, 0],
            zoom: 2,
            minZoom: 0,
            maxZoom: 6, // Locked to match downloaded cache
            maxBounds: bounds,
            maxBoundsViscosity: 1.0,
            attributionControl: false,
            zoomSnap: 0.1, // Allow fractional zooms to fit screen perfectly
            zoomDelta: 0.5,
            wheelPxPerZoomLevel: 120, // Higher = slower zoom (default is 60)
            wheelDebounceTime: 40     // Smoother wheel handling
        });

        // Function to fit map to screen so it COVERS the viewport (no black bars)
        function fitMapToScreen() {
            const container = map.getSize();
            // Map logic: z0 is 512w x 256h pixels
            // At zoom z: width = 512 * 2^z, height = 256 * 2^z

            // Calculate zoom needed to fill height
            const minZoomH = Math.log2(container.y / 256);
            // Calculate zoom needed to fill width
            const minZoomW = Math.log2(container.x / 512);

            // "Cover" behavior: take the larger of the two required zooms
            // This ensures BOTH dimensions are at least as big as the screen
            const fitZoom = Math.max(minZoomH, minZoomW);

            map.setMinZoom(fitZoom);

            // If we are currently zoomed out too far, snap in
            if (map.getZoom() < fitZoom) {
                map.setZoom(fitZoom);
            }
        }

        // Apply fit on load and resize
        fitMapToScreen();
        window.addEventListener('resize', fitMapToScreen);

        // Add the Tile Layer pointing to your local Python Proxy
        // L.tileLayer template: {z}, {x}, {y} are automatically filled by Leaflet
        // 'tms: false' is standard for XYZ (Google/OSM style). 
        // If tiles look "wrong" (scrambled vertically), we might need tms: true or Y-inversion.
        // NASA Mars Viking Mosaic usually supports up to level 9 approx.
        // We use maxNativeZoom: 9 so that if you zoom to 12, it scales the level 9 tiles.
        const tileLayer = L.tileLayer('http://127.0.0.1:8000/tiles/{z}/{x}/{y}.jpg', {
            maxZoom: 12,
            maxNativeZoom: 9, // IMPORTANT: Prevents loading non-existent high-res tiles
            minZoom: 0,
            noWrap: true,     // IMPORTANT: Prevents the map from repeating horizontally
            bounds: bounds,
            tileSize: 256,
            keepBuffer: 2,    // Keep 2 rows of tiles around the view to smooth panning
            updateWhenIdle: false, // Update during pan for smoother feel
            className: 'mars-tiles'
        }).addTo(map);

        // Add a scale control (optional, but cool for maps)
        L.control.scale().addTo(map);

        // Debug: Log tile usage to console
        map.on('tileload', function (e) {
            console.log('Loaded tile:', e.coords);
        });
        map.on('tileerror', function (e) {
            console.warn('Failed tile:', e.coords);
        });
    </script>
</body>

</html>
